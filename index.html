<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      /* Tablet rendering: no artificial zoom — the app renders at native
         resolution everywhere (same as the reader), which keeps every screen
         fully adaptive and avoids vertical overflow in landscape. We only keep
         the --nav-h CSS variable (bottom nav height) so the mini player sits
         correctly above the nav bar. */
      (function () {
        document.documentElement.style.setProperty('--nav-h', '56px');
      })();
    </script>
    <meta name="theme-color" content="#0a0905" />
    <meta name="description" content="Warhammer Companion — Library, Factions, Reading Order, Painting and AI Oracle" />

    <!-- PWA / mobile app meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WH Companion" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <title>WH Companion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
