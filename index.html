<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="oQYTnAj8-CD1-dLgPwlPry4956qk2zBw9THunsggln4" />
    <script>
      /* Tablet scaling: on touch screens wider than a phone, scale the whole UI up
         so content fills large tablet screens and stays readable (otherwise it
         renders at phone size and looks tiny — especially as an installed PWA).
         Body zoom (not html) keeps Android rotation working; we compensate the body
         height by 1/scale so the zoom never overflows vertically (the old bug). A
         reader (EPUB/PDF) sets data-reader-open so its own native rendering isn't
         re-zoomed on rotation. --nav-h tracks the scaled bottom-nav height for the
         mini player. */
      (function () {
        var html = document.documentElement;
        function apply() {
          if (html.dataset.readerOpen === '1') return;
          var w = window.innerWidth, h = window.innerHeight;
          // Scale up anything wider than a phone — tablets AND desktops — so the
          // phone-tuned UI reads comfortably on big screens. Phones (≤600px) render
          // native. The reader suspends this zoom (data-reader-open) and its resize
          // handler is guarded, so scaling no longer destabilises epub.js.
          if (document.body && w > 600) {
            var landscape = w > h;
            // Tablets scale up more; large desktop screens (>1500px) take a more
            // modest scale so the UI isn't oversized on a big monitor.
            var cap = w > 1500 ? 1.35 : (landscape ? 1.65 : 1.95);
            var sc = Math.max(1, Math.min(cap, w / 430));
            document.body.style.zoom = sc.toFixed(4);
            document.body.style.height = (100 / sc).toFixed(4) + 'dvh';
            html.style.setProperty('--nav-h', (56 * sc).toFixed(1) + 'px');
          } else if (document.body) {
            document.body.style.removeProperty('zoom');
            document.body.style.removeProperty('height');
            html.style.setProperty('--nav-h', '56px');
          } else {
            html.style.setProperty('--nav-h', '56px');
          }
        }
        if (document.body) apply(); else document.addEventListener('DOMContentLoaded', apply);
        window.addEventListener('resize', apply);
        window.addEventListener('orientationchange', function () { setTimeout(apply, 300); });
        window.__applyTabletZoom = apply;
      })();
    </script>
    <meta name="theme-color" content="#0a0905" />
    <meta name="description" content="Warhammer Companion — Library, Factions, Reading Order, Painting and AI Oracle" />

    <!-- PWA / mobile app meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WH Companion" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <title>WH Companion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
