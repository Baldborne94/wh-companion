<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="oQYTnAj8-CD1-dLgPwlPry4956qk2zBw9THunsggln4" />
    <script>
      /* Tablet scaling: on touch screens wider than a phone, scale the whole UI up
         so content fills large tablet screens and stays readable (otherwise it
         renders at phone size and looks tiny — especially as an installed PWA).
         Body zoom (not html) keeps Android rotation working; we compensate the body
         height by 1/scale so the zoom never overflows vertically (the old bug). A
         reader (EPUB/PDF) sets data-reader-open so its own native rendering isn't
         re-zoomed on rotation. --nav-h tracks the scaled bottom-nav height for the
         mini player.

         Cross-browser consistency: on touch devices the window always fills the
         screen, yet Chrome and Firefox report window.innerWidth differently (each
         has its own toolbar/zoom baseline), which made the UI a different physical
         size per browser on the *same* tablet. screen.width/height are anchored to
         the physical panel and agree across browsers, so we drive the scale from
         those on touch devices. Desktop windows are resizable, so there innerWidth
         (the actual window width) stays the right signal — but the desktop cap used
         to switch abruptly at a single 1500px threshold, so two browsers reporting
         innerWidth a few pixels apart (scrollbar width, OS scaling rounding,
         devicePixelRatio handling all differ slightly) could land on opposite sides
         and end up with visibly different cap values (1.65 vs 1.35). The cap is now
         interpolated smoothly across a width range instead of jumping at one point,
         so a small cross-browser reporting difference only ever produces a small
         visual difference. */
      (function () {
        var html = document.documentElement;
        var isTouch = (navigator.maxTouchPoints || 0) >= 1 || 'ontouchstart' in window;
        function apply() {
          if (html.dataset.readerOpen === '1') return;
          var w = window.innerWidth, h = window.innerHeight;
          var landscape = w > h;
          // Device-anchored width on touch (browser-consistent); window width on
          // desktop (where the window is resizable and innerWidth is what we scale to).
          var baseW = w;
          if (isTouch && window.screen && window.screen.width) {
            var longEdge  = Math.max(window.screen.width, window.screen.height);
            var shortEdge = Math.min(window.screen.width, window.screen.height);
            baseW = landscape ? longEdge : shortEdge;
          }
          // Scale up anything wider than a phone — tablets AND desktops — so the
          // phone-tuned UI reads comfortably on big screens. Phones (≤600px) render
          // native. The reader suspends this zoom (data-reader-open) and its resize
          // handler is guarded, so scaling no longer destabilises epub.js.
          if (document.body && baseW > 600) {
            var cap;
            if (isTouch) {
              // Tablets: a gentle upscale is enough — the phone-tuned UI is already
              // legible at tablet viewing distance, and a big zoom just eats screen
              // (especially vertical room in landscape, where the UI is a centred
              // column with limited height). A flat cap per orientation keeps the
              // size identical across browsers (sc always lands on the cap here).
              cap = landscape ? 1.3 : 1.5;
            } else {
              // Desktop: interpolate the cap smoothly between 1200px and 1800px
              // (instead of a hard 1500px cliff) so small cross-browser innerWidth
              // differences near that range don't cause a visible size jump.
              var capLow  = landscape ? 1.65 : 1.95;
              var capHigh = 1.35;
              var t = Math.max(0, Math.min(1, (baseW - 1200) / 600));
              cap = capLow + (capHigh - capLow) * t;
            }
            var sc = Math.max(1, Math.min(cap, baseW / 430));
            document.body.style.zoom = sc.toFixed(4);
            document.body.style.height = (100 / sc).toFixed(4) + 'dvh';
            html.style.setProperty('--nav-h', (56 * sc).toFixed(1) + 'px');
          } else if (document.body) {
            document.body.style.removeProperty('zoom');
            document.body.style.removeProperty('height');
            html.style.setProperty('--nav-h', '56px');
          } else {
            html.style.setProperty('--nav-h', '56px');
          }
        }
        if (document.body) apply(); else document.addEventListener('DOMContentLoaded', apply);
        window.addEventListener('resize', apply);
        window.addEventListener('orientationchange', function () { setTimeout(apply, 300); });
        window.__applyTabletZoom = apply;
      })();
    </script>
    <meta name="theme-color" content="#0a0905" />
    <meta name="description" content="Warhammer Companion — Library, Factions, Reading Order, Painting and AI Oracle" />

    <!-- PWA / mobile app meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WH Companion" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <title>WH Companion</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
