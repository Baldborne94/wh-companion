<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Twin-tailed comet of Sigmar">
  <defs>
    <linearGradient id="cometGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5df9a"/>
      <stop offset="50%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8a6a15"/>
    </linearGradient>
    <filter id="cometGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#cometGlow)">
    <!-- left tail -->
    <path d="M100,90 C80,104 42,130 30,158 C24,174 28,186 40,193 C47,168 68,136 94,110 C99,105 101,97 100,90 Z"
          fill="url(#cometGold)" stroke="#5a4410" stroke-width="1" stroke-linejoin="round"/>
    <!-- right tail (mirrored) -->
    <path d="M100,90 C120,104 158,130 170,158 C176,174 172,186 160,193 C153,168 132,136 106,110 C101,105 99,97 100,90 Z"
          fill="url(#cometGold)" stroke="#5a4410" stroke-width="1" stroke-linejoin="round"/>
    <!-- comet head: faceted four-point sparkle -->
    <path d="M100,22
             C104,48 110,58 136,64
             C110,70 104,80 100,106
             C96,80 90,70 64,64
             C90,58 96,48 100,22 Z"
          fill="url(#cometGold)" stroke="#5a4410" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>
