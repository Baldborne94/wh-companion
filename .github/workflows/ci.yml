name: CI

# Run the test suite and a production build on every PR and on pushes to main,
# so nothing that breaks the tests or the build can be merged unnoticed.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit + component tests
        run: npm test

      - name: Production build
        run: npm run build
