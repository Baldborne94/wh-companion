name: CI

# Run the test suite and a production build on every PR and on pushes to main,
# so nothing that breaks the tests or the build can be merged unnoticed.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit + component tests
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # CI has no pre-installed browser, so fetch the one Playwright expects.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The webServer in playwright.config.js builds + previews with dummy Supabase env.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
