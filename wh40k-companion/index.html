<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0905" />
    <meta name="description" content="Warhammer 40,000 Companion — Library, Factions, Reading Order, Painting and AI Oracle" />

    <!-- PWA / mobile app meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WH40K" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <title>WH40K Companion</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Tablet CSS-transform scaling — keeps viewport at device-width so rotation works natively */
      function applyTabletScale() {
        if (navigator.maxTouchPoints < 1) return; // desktop, skip
        var w = window.innerWidth;
        var h = window.innerHeight;
        var root = document.getElementById('root');
        if (!root) return;
        if (w <= 520) {
          // Phone: reset any previously applied scale
          root.style.cssText = '';
          return;
        }
        var scale = Math.min(1.9, w / 430);
        root.style.width          = '430px';
        root.style.height         = Math.ceil(h / scale) + 'px';
        root.style.transformOrigin = 'top left';
        root.style.transform      = 'scale(' + scale.toFixed(4) + ')';
        root.style.overflow       = 'hidden';
        root.style.position       = 'relative';
      }
      applyTabletScale();
      window.addEventListener('orientationchange', function () { setTimeout(applyTabletScale, 300); });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
