<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      /* Tablet viewport scaling — initial paint + physical orientation change only */
      function applyTabletViewport(){
        if(navigator.maxTouchPoints < 1) return;
        var w = window.innerWidth || screen.width;
        var el = document.querySelector('meta[name=viewport]');
        if(!el) return;
        if(w <= 520){
          el.content = 'width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no';
        } else {
          var s = Math.min(1.9, w / 430);
          el.content = 'width=430,initial-scale=' + s.toFixed(2) + ',user-scalable=no';
        }
      }
      applyTabletViewport();
      /* orientationchange only — NOT resize, to avoid conflicting with the epub reader */
      window.addEventListener('orientationchange', function(){ setTimeout(applyTabletViewport, 300); });
    </script>
    <meta name="theme-color" content="#0a0905" />
    <meta name="description" content="Warhammer 40,000 Companion — Library, Factions, Reading Order, Painting and AI Oracle" />

    <!-- PWA / mobile app meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WH40K" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <title>WH40K Companion</title>
</head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
