<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <script>
      /* Tablet zoom: applied to body so html stays normal → device rotation works.
         position:fixed elements (reader, mini player) are unaffected by body zoom
         and remain at full native resolution, which is correct for a tablet. */
      (function () {
        var styleEl = document.createElement('style');
        document.head.appendChild(styleEl);
        function applyTabletZoom() {
          if (navigator.maxTouchPoints < 1) return;
          var w = window.innerWidth || screen.width;
          var html = document.documentElement;
          if (w <= 520) {
            styleEl.textContent = '';
            html.style.removeProperty('--nav-h');
            return;
          }
          var sc = Math.min(1.9, w / 430);
          /* body zoom scales all regular content; height compensates so body fits viewport */
          styleEl.textContent =
            'body{zoom:' + sc.toFixed(4) + ';height:' + (100 / sc).toFixed(4) + 'dvh!important}' +
            'html{overflow:clip}';
          /* nav bar is 56px layout → 56*sc visual; mini player must clear it */
          html.style.setProperty('--nav-h', (56 * sc).toFixed(1) + 'px');
        }
        applyTabletZoom();
        window.addEventListener('orientationchange', function () { setTimeout(applyTabletZoom, 300); });
      })();
    </script>
    <meta name="theme-color" content="#0a0905" />
    <meta name="description" content="Warhammer 40,000 Companion — Library, Factions, Reading Order, Painting and AI Oracle" />

    <!-- PWA / mobile app meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WH40K" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <title>WH40K Companion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
